<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitstelle 112 Simulator</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.phone{
width:420px;
background:#1e293b;
border-radius:20px;
padding:20px;
}

.display{
background:#111827;
padding:15px;
border-radius:10px;
text-align:center;
}

#number{
font-size:40px;
margin-bottom:10px;
}

#status{
color:#22c55e;
}

.keypad{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:20px;
}

.key{
height:70px;
font-size:24px;
border:none;
border-radius:50%;
background:#374151;
color:white;
cursor:pointer;
}

.call{
background:#22c55e;
}

.chat{
height:250px;
overflow-y:auto;
background:#111827;
margin-top:20px;
padding:10px;
border-radius:10px;
}

.inputArea{
display:none;
margin-top:10px;
}

.inputArea input{
width:70%;
padding:10px;
}

.inputArea button{
padding:10px;
}
</style>

</head>

<body>

<div class="phone">

<div class="display">

<div id="number"></div>

<div id="status">
Nummer eingeben
</div>

</div>

<div class="keypad">

<button class="key" onclick="add('1')">1</button>
<button class="key" onclick="add('2')">2</button>
<button class="key" onclick="add('3')">3</button>

<button class="key" onclick="add('4')">4</button>
<button class="key" onclick="add('5')">5</button>
<button class="key" onclick="add('6')">6</button>

<button class="key" onclick="add('7')">7</button>
<button class="key" onclick="add('8')">8</button>
<button class="key" onclick="add('9')">9</button>

<button class="key" onclick="removeDigit()">⌫</button>
<button class="key" onclick="add('0')">0</button>

<button class="key call" onclick="call112()">
📞
</button>

</div>

<div id="chat" class="chat"></div>

<div id="inputArea" class="inputArea">

<input
id="message"
placeholder="Antwort eingeben">

<button onclick="sendMessage()">
Senden
</button>
  <button onclick="startVoice()">
🎤 Sprechen
</button>

</div>

</div>

<script>

const WORKER_URL =
"https://notruf-api.keymasterjonas.workers.dev";

let currentNumber = "";
  let conversation = [];

function add(number){

currentNumber += number;

document.getElementById("number")
.innerText = currentNumber;

}

function removeDigit(){

currentNumber =
currentNumber.slice(0,-1);

document.getElementById("number")
.innerText = currentNumber;

}

function chat(sender,text){

const box =
document.getElementById("chat");

box.innerHTML +=
`<p><b>${sender}:</b> ${text}</p>`;

box.scrollTop =
box.scrollHeight;

}

function call112(){

if(currentNumber !== "112"){

document.getElementById("status")
.innerText =
"❌ Nummer unbekannt";

return;

}

document.getElementById("status")
.innerText =
"Verbunden mit Leitstelle";

document.getElementById("inputArea")
.style.display =
"block";

chat(
"112",
"Notruf 112. Wo befindet sich der Notfall?"
);
  conversation = [];

}

async function sendMessage(){

const input =
document.getElementById("message");

const text =
input.value;

if(!text) return;

chat("Du",text);

conversation.push({
role:"user",
content:text
});

input.value = "";

try{

const response =
await fetch(
WORKER_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
messages:conversation
})
}
);

const data =
await response.json();

chat(
"112",
data.answer
);
  
  speak(data.answer);
  
  conversation.push({
role:"assistant",
content:data.answer
});

}catch{

chat(
"112",
"Verbindung zur Leitstelle nicht möglich."
);

}

}
function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const recognition =
new SpeechRecognition();

recognition.lang = "de-DE";

recognition.start();

recognition.onresult =
function(event){

const text =
event.results[0][0].transcript;

document.getElementById(
"message"
).value = text;

sendMessage();

};

}
  function speak(text){

const speech =
new SpeechSynthesisUtterance(text);

speech.lang = "de-DE";

speechSynthesis.speak(speech);

}
``
</script>

</body>
</html>
